name: MDBM GitHub read-only regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdbm-readonly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MDBM and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source
        run: python -m py_compile mdbm.py
      - name: GitHub feature tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_github_remote.py
      - name: Windows regressions (excluding two legacy subprocess interrupt tests)
        if: runner.os == 'Windows'
        # On hosted Windows runners the two existing asyncio ScriptRunner
        # subprocess tests interrupt pytest with SIGINT. Neither test was
        # modified here. GitHub feature tests run separately and unfiltered.
        run: python -m pytest -q -k "not test_script_output_sanitized_and_bounded and not test_script_cancellation"
      - name: Complete Linux regression suite
        if: runner.os == 'Linux'
        run: python -m pytest -q
