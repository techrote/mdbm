name: MDBM-003 temporary release validation
on:
  push:
    branches:
      - impl/mdbm-003-terminal-path-ingress
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete release and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile MDBM source
        run: python -m py_compile mdbm.py
      - name: Full pytest suite
        run: python -m pytest -q --full-trace
