name: MDBM-002 Windows-targeted validation

on:
  push:
    branches:
      - impl/mdbm-002-tab-strip
  workflow_dispatch:

jobs:
  windows-relevant:
    name: MDBM-002 relevant suites (Windows, Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release and test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt && python -m pip install -e ".[test]"
      - name: Run document, compositor, interaction and tab suites
        run: >-
          python -m pytest -q
          tests/test_core.py
          tests/test_documents.py
          tests/test_goldens.py
          tests/test_interactions.py
          tests/test_tabs.py
          tests/test_theme.py
          tests/test_theme_frames.py
