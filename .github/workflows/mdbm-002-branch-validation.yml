name: MDBM-002 branch validation

on:
  push:
    branches:
      - impl/mdbm-002-tab-strip
  workflow_dispatch:

jobs:
  linux-full:
    name: Full pytest (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release and test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt && python -m pip install -e ".[test]"
      - name: Run complete pytest suite
        run: python -m pytest -q

  windows-supplement:
    name: Pytest excluding existing Windows ScriptRunner interrupt case
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release and test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt && python -m pip install -e ".[test]"
      - name: Run suite except pre-existing Windows cancellation interruption
        run: python -m pytest -q -k "not test_script_cancellation"
