name: MDBM-002 branch validation

on:
  push:
    branches:
      - impl/mdbm-002-tab-strip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-goldens:
    if: ${{ contains(github.event.head_commit.message, '[regen-goldens]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release and test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt && python -m pip install -e ".[test]"
      - name: Regenerate deterministic composed-cell baselines
        run: python tests/update_goldens.py
      - name: Commit regenerated baselines to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/frames.json
          if git diff --cached --quiet; then
            echo "No golden changes"
            exit 0
          fi
          git commit -m "MDBM-002: refresh compositor golden baselines"
          git push

  pytest:
    if: ${{ !contains(github.event.head_commit.message, '[regen-goldens]') }}
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install release and test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements.txt && python -m pip install -e ".[test]"
      - name: Run complete pytest suite
        run: python -m pytest -q
