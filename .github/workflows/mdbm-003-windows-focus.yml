name: MDBM-003 Windows ingress qualification (temporary)
on:
  push:
    branches: [fix/mdbm-003-repeat-drop-context]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ingress:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release/test dependencies
        run: python -m pip install -e ".[test]"
      - name: Windows parser, document, tab and input tests
        run: python -m pytest -q tests/test_drop.py tests/test_documents.py tests/test_interactions.py tests/test_pty.py
