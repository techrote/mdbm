[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbm-workspace"
version = "1.0.0a2"
description = "A protected cell-composited terminal Markdown workspace"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
mdbm = "mdbm:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pexpect>=4.9; sys_platform != 'win32'"]

[tool.setuptools]
py-modules = ["mdbm"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.data-files]
"share/mdbm" = ["mdbm.conf", "requirements.txt", "README.md"]
"share/mdbm/themes" = ["themes/*.theme"]
"share/mdbm/docs" = ["docs/*.md"]
"share/mdbm/examples" = ["examples/*.md"]
