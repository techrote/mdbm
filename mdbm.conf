# MDBM configuration — manually maintained; runtime never rewrites this file.
schema = "mdbm-config/1.0"

[application]
root = "."
state_directory = ".mdbm"
max_file_mib = 16

[layout]
left_visible = true
right_visible = true
edit_visible = true
view_visible = true
left_tile = "filesystem"
view_first = true
left_ratio = 0.30
view_ratio = 0.50
min_width = 12
min_height = 3

[artspace]
# Clockwise: top, right, bottom, left. Added before the available-space clamp.
outer = [4, 4, 4, 4]
maximum = [12, 12, 12, 12]
border_extra = 0
divider_extra = 0
spacer_extra = 0
band_maximum = 4

[input]
profile = "standard" # "vim" provides a documented, focused Vim subset.
tab_size = 4
double_click_ms = 400
submenu_delay_ms = 250

[bindings]
# Bind non-conflicting prompt_toolkit key sequences to command IDs.
"f8" = "cue.user-1"
# "f9" = "theme.choose"

[appearance]
theme = "neon-circuitry"
theme_directories = ["themes"]
immersive = false
seed = -1             # -1 respects theme mode; nonnegative values force a seed.
motion = "normal"     # off / reduced / normal / high; host motion policy wins.

[capabilities]
colour_depth = "auto" # auto / truecolour / 256 / 16 / mono
unicode = true
mouse = true
terminal_focus = true

[accessibility]
high_contrast = false
reduced_motion = false
ascii_only = false

[scripts]
# Only explicitly allowlisted Python files beside mdbm.py may run.
# Arguments are entered as a JSON array. Scripts are trusted, not sandboxed.
allowlist = []
max_output_kib = 256

[session]
restore = true
recovery_seconds = 5
save_seconds = 5
parse_debounce_ms = 150
fps = 12
paint_budget = 200000
